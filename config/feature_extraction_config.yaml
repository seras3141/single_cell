# Feature Extraction Configuration

# Input/Output paths
paths:
  image_dir: "data/sample_data_out/split_data/test"
  mask_dir: "data/sample_data_out/split_data/test"
  # mask_dir: "data/sample_data_out/results/cyto3/test/masks_3d"
  # input_dir: "data/sample_data_out/split_data/test"
  output_dir: "data/sample_data_out/features_output/split_data/test/"
  # Alternative: specify exact dataset paths
  # dataset_paths:
  #   - input_dir: "data/BF+IF Experiments_2D_train_test_dataset"
  #     output_dir: "data/features_output/BF_IF_2D"
  #   - input_dir: "data/Plate 2426_2D_train_test_dataset" 
  #     output_dir: "data/features_output/Plate_2426"


# Feature extraction parameters
feature_extraction:
  # Feature extraction method
  method: "incarta"  # Options: "incarta", "regionprops", "pyradiomics" (needs .venv-pyradiomics), "scportrait"

  # File matching patterns
  image_pattern: "*_BF.tif"
  mask_pattern: "*_pred_mask.tif"

  # Processing options
  n_jobs: -1  # Number of images processed concurrently (file-level workers).
              # -1 = all cores, 1 = sequential. Inner per-cell parallelism is
              # forced to 1 when >1 file worker is used. Ignored for scportrait
              # (kept sequential on one GPU).
  
  # File organization
  output:
    # Output options
    save_individual_files: true   # Save features for each image separately
    save_combined_file: false      # Save all features in one CSV
    include_metadata: false        # Include filename and processing info

    # Output file naming
    individual_format: "{image_name}_features.csv"
    combined_filename: "all_features.csv"
    
    # Directory structure
    create_subdirs: true  # Create subdirectories for different datasets

    # File format and grouping. granularity "well" writes <well>.parquet plus
    # <well>_coverage.parquet (one row per image) and requires format "parquet".
    format: "csv"          # csv | parquet (parquet needs pyarrow)
    granularity: "image"   # image | well

  # scPortrait deep-learning featurization (used only when method: "scportrait")
  scportrait:
    project_location: "tmp/scportrait_projects"
    config_path: "src/feature_extraction/scportrait_project/config.yml"
    channel_names: ["brightfield", "brightfield_ch1"]
    overwrite: true
    debug: false
    save_plots: true

  # PyRadiomics per-cell features (used only when method: "pyradiomics"). Runs in
  # .venv-pyradiomics (pyradiomics-cuda + SimpleITK); defaults match the GPU delivery.
  pyradiomics:
    bin_width: 25
    force_2d: true
    normalize: true
    normalize_scale: 100
    min_pixels: 20              # provisional until the occupied-grey-level screen
    feature_classes: ["shape2D", "firstorder", "glcm", "glrlm", "glszm", "gldm", "ngtdm"]
    include_diagnostics: false  # keep PyRadiomics diagnostics_* columns
    require_cuda: false         # fail unless pyradiomics-cuda is installed


# Logging and monitoring
logging:
  level: "INFO"
  filename: "feature_extraction.log"
