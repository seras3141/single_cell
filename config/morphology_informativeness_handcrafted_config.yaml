# Informativeness gate on the per-well handcrafted-feature CSV tables. Same targets,
# folds and normalisation settings as the radiomics config; the driver overrides
# feature_csv, target_csv, dmso_well and output_dir together. gabor_mean and gabor_std
# are left out: they are aliased, boundary-dominated and not predictive.

morphology_informativeness:
  feature_csv: "data/MF5V1_processed Timelapse samples 19.03.2024/HD1509 MF5V1 0-72h 23-02-26/inference_filtered_sharpness/cellpose_sam/features_incarta/split_data"
  target_csv: "data/MF5V1_processed Timelapse samples 19.03.2024/HD1509 MF5V1 0-72h 23-02-26/inference_filtered_sharpness/cellpose_sam/mcherry_metrics/instance_metrics.csv"
  id_column: cell_id
  sample_id_column: null
  timepoint_column: null
  z_index_column: null
  target_columns: [percentile_75, percentile_90, percentile_95]
  group_by: sample_id
  n_splits: 5

  morphology_feature_patterns:
    - area
    - perimeter
    - elongation
    - compactness
    - circularity
    - feret_diameter
    - radius_of_gyration
    - major_axis
    - minor_axis
    - skewness
    - kurtosis
    - entropy
  suspect_feature_patterns:
    - "*intensity"

  ridge_alpha: 1.0
  nonlinear_backend: auto
  top_k_features: 5
  well_timepoint_scatter_top_k: 3
  well_timepoint_scatter_max_wells: null
  well_timepoint_scatter_max_points_per_well: 2000
  well_timepoint_scatter_seed: 0
  well_timepoint_colormap: viridis
  plate_layout_json: config/MF5v1_plate_layout.json

  normalize_to_dmso: true
  dmso_well: N11
  dmso_gate_min_peak_fraction: 0.10
  dmso_gate_absolute_floor: 30
  output_dir: results/morphology_informativeness_handcrafted
