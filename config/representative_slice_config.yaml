# Configuration for the representative-slice-per-cell branch (src/postprocessing).
#
# This is an ALTERNATIVE branch to inference_tracked/: it links raw inference/<model>/
# masks_3d slices across z with trackpy (as a z-linker only, min_track_length forced
# to 1), then per physical cell applies a blur gate + area/sharpness chooser to keep ONE
# representative z-slice, writing only those slices' masks to an output dir named
# inference_<filtered|unfiltered>_<chooser>/<model> (filtered = blur on) plus an auditable
# selection.csv. Feature/mCherry extraction then run unchanged against it -> one row per cell.
#
# Paths default to Ew2-1 (cellpose_sam) so the config runs out of the box; a
# per-experiment SLURM driver overrides input_masks_dir/bf_3d_dir/output_dir.
# Loaded centrally via ConfigManager (this section merges onto PipelineConfig).

representative_slice:
  # --- Paths (explicit dirs) ---
  input_masks_dir: "data/MF5V1_processed Timelapse samples 19.03.2024/Ew2-1 MF5V1 0-72h 06-03-26/inference/cellpose_sam/masks_3d"
  bf_3d_dir: "data/MF5V1_processed Timelapse samples 19.03.2024/Ew2-1 MF5V1 0-72h 06-03-26/3d_data"
  output_dir: "data/MF5V1_processed Timelapse samples 19.03.2024/Ew2-1 MF5V1 0-72h 06-03-26/inference_unfiltered_area/cellpose_sam"

  # --- Selection criterion: blur gate, then chooser (selection_metric) ---
  sharpness_gate_fraction: 0.7   # keep slices with lap_var >= f * that cell's max
  # chooser among gated slices: area (largest cross-section, shipped default) or
  # sharpness (sharpest slice; the Phase 6c z-edge check showed it avoids the oblique
  # edge-slice area inflation). The other metric breaks ties, then z near the centroid.
  selection_metric: area         # area | sharpness
  min_area: 10                   # guard: drop debris (also linker lower bound)
  max_area: 100000               # generous; the tracker filters by max_area (default
                                 # 5000 would silently drop big cells)

  # --- Sharpness ---
  sharpness_erosion_px: 1        # erode mask before laplacian_variance so it measures
                                 # the interior, not the mask edge (0 = unmasked bbox)

  # --- Optional pre-link absolute blur-map cell filter (mirrors the tracked pipeline's
  #     filter_before_tracking): drops blurry/junk cells BEFORE linking. Default OFF
  #     (unfiltered). blur_heatmap_dir points at the cached {prefix}_BF_3d_blur_heatmap.tif
  #     (Ew2-1); "" -> compute from BF. threshold/invert match postprocessing_config.yaml. ---
  enable_blur_filter: false
  blur_heatmap_dir: "data/MF5V1_processed Timelapse samples 19.03.2024/Ew2-1 MF5V1 0-72h 06-03-26/blur_heatmaps"
  blur_threshold: 0.5
  blur_invert_threshold: false

  # --- trackpy z-linker (min_track_length is FORCED to 1 in code; the default of 3
  #     drops ~58% of cells, exactly the short-track cells we must keep) ---
  search_range: 5.0
  memory: 1

  # --- Data convention: output z-label = stack index + z_index_offset. split_data z0
  #     is a projection excluded from the 3D stack, so index i maps to z(i + 1). ---
  z_index_offset: 1

  # --- I/O ---
  mask_pattern: "*_pred_mask_3d.zarr"
  # tif so downstream extraction can read it (incarta cv2.imread / mcherry tifffile);
  # matches the tracked branch's final_2d/. Raw input masks above stay .zarr.
  output_label_format: tif       # tif | zarr | hdf5 (must match what extraction reads)

  # --- Execution ---
  n_jobs: null                   # null -> SLURM_CPUS_PER_TASK / cpu_count
  overwrite_existing: false
