# Known-missing inputs and excluded stacks, keyed by processed-experiment directory name
# (the pMF5V1 plate prefix is shared by every culture). Loaded by
# src/utils/data_exclusions.py.
#
# known_missing:   an input slice absent from the raw data. Feature extraction logs the
#                  resulting unpaired mask as expected instead of failing the run.
# excluded_stacks: a (sample, timepoint) stack that is present but unusable. It is still
#                  extracted; the feature_to_mcherry loaders drop its rows.

known_missing: []

