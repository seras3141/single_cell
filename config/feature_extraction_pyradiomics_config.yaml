paths:
  image_dir: ""
  mask_dir: ""
  output_dir: ""

feature_extraction:
  method: "pyradiomics"
  image_pattern: "*_BF.tif"
  mask_pattern: "*_pred_mask.tif"

  n_jobs: 8  # CPU file workers; the probe tunes this

  output:
    format: "parquet"
    granularity: "well"
    save_individual_files: false
    save_combined_file: false
    include_metadata: true
    create_subdirs: false

  pyradiomics:
    bin_width: 25
    force_2d: true
    normalize: true
    normalize_scale: 100
    min_pixels: 20
    feature_classes: ["shape2D", "firstorder", "glcm", "glrlm", "glszm", "gldm", "ngtdm"]
    include_diagnostics: false

logging:
  level: "INFO"
  filename: "feature_extraction.log"
